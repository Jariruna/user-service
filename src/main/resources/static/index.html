<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Portal de Usuarios</title>
    <!-- Enlazamos la hoja de estilos tradicional -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <!-- Pestañas de Navegación (Registro / Login) -->
    <div class="tabs-container">
        <button id="tabLogin" onclick="switchTab('login')" class="tab-btn active-tab">Iniciar Sesión</button>
        <button id="tabRegister" onclick="switchTab('register')" class="tab-btn">Registrarse</button>
    </div>

    <!-- ================= FORMULARIO DE LOGIN ================= -->
    <div id="loginSection">
        <div class="header-text">
            <h1>Bienvenido de nuevo</h1>
            <p>Ingresa tus credenciales para acceder al almacén</p>
        </div>

        <form id="loginForm" class="form-space">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="loginEmail" required placeholder="Ej. correo@example.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary">
                Entrar al Sistema
            </button>
        </form>
    </div>

    <!-- ================= FORMULARIO DE REGISTRO ================= -->
    <div id="registerSection" class="hidden">
        <div class="header-text">
            <h1>Crea una Cuenta</h1>
            <p>Regístrate para obtener acceso al sistema</p>
        </div>

        <form id="registerForm" class="form-space">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="Ej. jose_luis">
            </div>

            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="Ej. correo@example.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-dark">
                Registrar Usuario
            </button>
        </form>
    </div>

    <!-- Mensaje de Alerta / Respuesta -->
    <div id="responseMessage" class="alert hidden"></div>
</div>

<!-- Enlazamos el archivo de lógica JavaScript -->
<script src="script.js"></script>
</body>
</html>
