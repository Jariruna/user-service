<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Portal de Usuarios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <!-- Pestañas de Navegación (Registro / Login) -->
    <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLogin" onclick="switchTab('login')" class="flex-1 pb-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 cursor-pointer transition">Iniciar Sesión</button>
        <button id="tabRegister" onclick="switchTab('register')" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent cursor-pointer transition">Registrarse</button>
    </div>

    <!-- ================= FORMULARIO DE LOGIN ================= -->
    <div id="loginSection">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Bienvenido de nuevo</h1>
            <p class="text-sm text-slate-500">Ingresa tus credenciales para acceder al almacén</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="Ej. correo@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="loginPassword" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md cursor-pointer">
                Entrar al Sistema
            </button>
        </form>
    </div>

    <!-- ================= FORMULARIO DE REGISTRO ================= -->
    <div id="registerSection" class="hidden">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Crea una Cuenta</h1>
            <p class="text-sm text-slate-500">Regístrate para obtener acceso al sistema</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                <input type="text" id="username" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="Ej. jose_luis">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="Ej. correo@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-900 transition duration-200 shadow-md cursor-pointer">
                Registrar Usuario
            </button>
        </form>
    </div>

    <!-- Mensaje de Alerta / Respuesta -->
    <div id="responseMessage" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>
</div>

<script>
    // Control de pestañas
    function switchTab(tab) {
        const loginSec = document.getElementById('loginSection');
        const regSec = document.getElementById('registerSection');
        const tabLog = document.getElementById('tabLogin');
        const tabReg = document.getElementById('tabRegister');
        const msg = document.getElementById('responseMessage');

        msg.classList.add('hidden');

        if (tab === 'login') {
            loginSec.classList.remove('hidden');
            regSec.classList.add('hidden');
            tabLog.className = "flex-1 pb-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 cursor-pointer transition";
            tabReg.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent cursor-pointer transition";
        } else {
            regSec.classList.remove('hidden');
            loginSec.classList.add('hidden');
            tabReg.className = "flex-1 pb-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 cursor-pointer transition";
            tabLog.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent cursor-pointer transition";
        }
    }

    const messageDiv = document.getElementById('responseMessage');

    // Lógica de Registro
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();
            messageDiv.classList.remove('hidden');

            if (response.ok) {
                messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-green-100 text-green-700 border border-green-300";
                messageDiv.textContent = `¡Registro exitoso! Ya puedes iniciar sesión.`;
                document.getElementById('registerForm').reset();
                setTimeout(() => switchTab('login'), 2000);
            } else {
                messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 border border-red-300";
                messageDiv.textContent = data.message || "Ocurrió un error al registrar el usuario.";
            }
        } catch (error) {
            messageDiv.classList.remove('hidden');
            messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 border border-red-300";
            messageDiv.textContent = "No se pudo conectar con el servidor backend.";
        }
    });

    // Lógica de Login (Con redirección automática al microservicio de productos en puerto 8080)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            // Nota: Asegúrate de tener implementado el endpoint POST /api/users/login en tu User-Service
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            messageDiv.classList.remove('hidden');

            if (response.ok) {
                messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-green-100 text-green-700 border border-green-300";
                messageDiv.textContent = "¡Login exitoso! Redirigiendo al almacén...";

                // 1. Guardamos el ID del usuario logueado en el almacenamiento local del navegador
                localStorage.setItem('userId', data.id);

                // 2. Redirigimos al microservicio de productos (Puerto 8080)
                setTimeout(() => {
                    window.location.href = `http://localhost:8080/productos.html?userId=${data.id}`;
                }, 1000);
            } else {
                messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 border border-red-300";
                messageDiv.textContent = data.message || "Credenciales incorrectas.";
            }
        } catch (error) {
            messageDiv.classList.remove('hidden');
            messageDiv.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 border border-red-300";
            messageDiv.textContent = "Error al intentar iniciar sesión.";
        }
    });
</script>
</body>
</html>
