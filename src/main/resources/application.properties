# Configuracion del nombre de la aplicacion
spring.application.name=user-service

# Configuracion de la Base de Datos H2 con persistencia en archivo local
spring.datasource.url=jdbc:h2:file:./data/userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar la Consola Web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion del Puerto del Microservicio
server.port=8081